
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | FitZone</title>

    <link rel="stylesheet" href="css/contact.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">

        <a href="index.html" class="logo">
            FIT<span>ZONE</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>

    </header>

    <!-- Contact Page -->
    <main class="contact-container">

        <div class="contact-heading">
            <h1>CONTACT US</h1>
            <p>LET'S GET STRONGER TOGETHER</p>
        </div>

        <div class="contact-content">

            <!-- Contact Information -->
            <section class="contact-info">

                <h2>Reach Us</h2>

                <div class="info-item">
                    <h3>☎ Phone</h3>
                    <p>+92 123456789</p>
                </div>

                <div class="info-item">
                    <h3>✉ Email</h3>
                    <p>info@fitzone.com</p>
                </div>

                <div class="info-item">
                    <h3>📍 Location</h3>
                    <p>Service road,Muslim town ,Lahore ,Pakistan</p>
                </div>

            </section>

            <!-- Contact Form -->
            <section class="contact-form">

                <h2>Send us a Message</h2>

                <form action="#" method="post">

                    <input
                        type="text"
                        name="name"
                        placeholder="Full Name"
                        required
                    >

                    <input
                        type="email"
                        name="email"
                        placeholder="Email Address"
                        required
                    >

                    <input
                        type="text"
                        name="subject"
                        placeholder="Subject"
                        required
                    >

                    <textarea
                        name="message"
                        placeholder="Enter Message"
                        rows="5"
                        required
                    ></textarea>

                    <button type="submit">SEND MESSAGE</button>

                </form>

            </section>

        </div>

        <!-- Footer -->
        <footer class="contact-footer">
            <p class="footer-brand">
                FITZONE | STRONGER. HEALTHIER. TOGETHER.
            </p>

            <p>© 2026 FITZONE. All rights reserved.</p>
        </footer>

    </main>

</body>
</html>
